<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Birdeye Skills — Console</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#141821; --panel2:#1a1f2b; --line:#262c3a;
    --text:#e6e9f2; --mute:#8b95ad; --accent:#5b9dff; --accent2:#7c5bff;
    --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;height:100vh;overflow:hidden}
  header{padding:8px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#0f1320,#0b0d12);flex-wrap:wrap}
  header h1{font-size:13px;margin:0;font-weight:700;letter-spacing:.2px}
  header h1 .sub{font-weight:500;color:var(--mute);margin-left:6px;font-size:11.5px}
  .pill{font-size:11px;color:var(--mute)}
  .headRight{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .histToggle{background:linear-gradient(180deg,#232b3b,#171d29);border:1px solid rgba(123,170,255,.22);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;letter-spacing:.2px;color:var(--text);cursor:pointer;white-space:nowrap;transition:.12s;box-shadow:0 0 0 1px rgba(91,157,255,.08)}
  .histToggle:hover{border-color:var(--accent);color:var(--accent)}
  .histToggle .n{font-size:10px;background:rgba(255,255,255,.14);border-radius:999px;padding:0 6px;margin-left:6px}
  .histToggle.off{opacity:.6}
  /* ── API key bar ── */
  .keybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 420px;min-width:min(100%,420px)}
  .keypanel{display:flex;flex-direction:column;gap:5px;min-width:min(100%,520px)}
  .keytop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .keystate{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
  .keystate.ok{color:var(--good);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
  .keystate.warn{color:var(--warn);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
  .keyhint{font-size:10.5px;color:var(--mute)}
  .keyfields{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .keyinput{position:relative;display:flex;align-items:center}
  .keyinput input{width:320px;max-width:min(72vw,420px);background:#0d1017;border:1px solid var(--line);border-radius:7px;padding:5px 32px 5px 9px;font-size:12px;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.2px;color:var(--text)}
  .keyinput input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,157,255,.14)}
  .eyebtn{position:absolute;right:4px;background:none;border:none;color:var(--mute);cursor:pointer;font-size:13px;line-height:1;padding:4px;border-radius:6px}
  .eyebtn:hover{color:var(--text);background:var(--panel2)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:linear-gradient(180deg,#3b7be8,#2c60c4);border-color:transparent;color:#fff}
  .btn.primary:hover{color:#fff;opacity:.92}
  .btn.ghost{background:transparent}
  .btn.dim{opacity:.7}
  /* ── Layout ── */
  .layout{display:grid;grid-template-columns:232px minmax(0,1fr) 300px;height:calc(100vh - 58px)}
  .layout.no-hist{grid-template-columns:232px minmax(0,1fr) 0}
  nav{padding:8px;border-right:1px solid var(--line);overflow:hidden;background:#0d1017;display:flex;flex-direction:column;gap:6px}
  .sc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;transition:.15s;display:flex;gap:8px;align-items:flex-start;position:relative;min-height:0}
  .sc:hover{border-color:var(--accent);background:var(--panel2)}
  .sc.active{border-color:var(--accent);background:linear-gradient(180deg,#16203a,#141821);box-shadow:0 0 0 1px rgba(91,157,255,.4)}
  .sc .ic{font-size:15px;line-height:1.3;flex-shrink:0}
  .sc .body{flex:1;min-width:0;padding-right:32px}
  .sc .nm{font-weight:600;font-size:11.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sc .ds{font-size:10px;color:var(--mute);margin-top:2px;line-height:1.32;display:-webkit-box;line-clamp:1;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .sc .gbad{position:absolute;top:7px;right:7px;font-size:9px;padding:1px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);font-weight:700;letter-spacing:.3px;line-height:1.45}
  .sc[data-grp="list"] .gbad{background:rgba(245,158,11,.12);color:#ffb94d;border-color:rgba(245,158,11,.3)}
  .sc[data-grp="token"] .gbad{background:rgba(91,157,255,.12);color:#7ab0ff;border-color:rgba(91,157,255,.3)}
  .sc[data-grp="wallet"] .gbad{background:rgba(124,91,255,.12);color:#a58bff;border-color:rgba(124,91,255,.3)}
  .betabadge{font-size:8.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#ffb94d;background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.35);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:middle;white-space:nowrap}
  .empty{padding:12px 4px;font-size:11.5px;color:var(--mute)}
  section.out{padding:12px 16px 18px;overflow:auto;height:100%;min-width:0}
  .form{background:linear-gradient(180deg,#141a26,#111621);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 18px 44px rgba(0,0,0,.18)}
  .form.rugForm{background:linear-gradient(180deg,#151c29,#121824)}
  .form.walletForm{background:linear-gradient(180deg,#171729,#121420)}
  .form .hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:10px}
  .form .hd .ttgrp{flex:1;min-width:0}
  .form .hd .ttl{display:block;font-weight:700;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .form .hd .formSub{font-size:11px;color:var(--mute);margin-top:3px;line-height:1.45}
  .form .hd .hdActions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .form .hd .cmdbadge{font-family:ui-monospace,monospace;font-size:10px;color:var(--mute);background:#0d1017;padding:2px 6px;border-radius:999px;border:1px solid var(--line);cursor:pointer}
  .form .hd .cmdbadge:hover{color:var(--accent);border-color:var(--accent)}
  .flowBtn{background:linear-gradient(180deg,#5b9dff,#2c60c4);border:1px solid rgba(123,170,255,.35);color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;letter-spacing:.2px;cursor:pointer;white-space:nowrap;transition:.12s;box-shadow:0 0 0 1px rgba(91,157,255,.15),0 8px 24px rgba(44,96,196,.22)}
  .flowBtn:hover{border-color:#9dc3ff;color:#fff;filter:brightness(1.05)}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px 10px;align-items:end}
  .fld{display:flex;flex-direction:column;gap:3px;min-width:0}
  .fld>label{font-size:9.5px;color:var(--mute);letter-spacing:.35px;text-transform:uppercase;font-weight:700}
  .fld.wide{grid-column:span 2}
  .fld input[type=text],.fld select,.fld textarea{width:100%;background:#0d1017;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;outline:none;transition:.12s;min-height:36px;color:var(--text);font-family:inherit}
  .fld textarea{min-height:76px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .fld input[type=text]:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,157,255,.14)}
  .fld.mono input[type=text]{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;letter-spacing:.2px}
  .mainInput input[type=text],.mainInput textarea{min-height:42px;font-size:13px;border-radius:10px;padding:9px 10px;background:#0b0f17}
  .skillHero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(210px,1fr);gap:10px;margin-bottom:10px}
  .heroCopy{padding:12px 13px;border:1px solid rgba(123,170,255,.15);border-radius:12px;background:linear-gradient(180deg,rgba(91,157,255,.12),rgba(91,157,255,.04))}
  .walletHero .heroCopy{border-color:rgba(124,91,255,.2);background:linear-gradient(180deg,rgba(124,91,255,.14),rgba(124,91,255,.05))}
  .heroKicker{font-size:10px;letter-spacing:.42px;text-transform:uppercase;color:#9ab8ff;font-weight:800}
  .walletHero .heroKicker{color:#b59dff}
  .heroDesc{font-size:12px;line-height:1.55;margin-top:5px}
  .heroTags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .heroTag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(8,10,15,.75);border:1px solid rgba(123,170,255,.18);font-size:10.5px;color:#d8e3ff}
  .walletHero .heroTag{border-color:rgba(124,91,255,.22);color:#e3dcff}
  .heroStats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .spotCard{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0d1017}
  .spotEyebrow{display:block;font-size:9.5px;letter-spacing:.36px;text-transform:uppercase;color:var(--mute);font-weight:700}
  .spotValue{display:block;font-size:16px;font-weight:800;letter-spacing:.2px;margin-top:4px}
  .spotHint{display:block;font-size:10.5px;color:var(--mute);margin-top:4px;line-height:1.45}
  .skillSplit{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px;align-items:start}
  .formMain{padding:11px;border:1px solid rgba(255,255,255,.06);border-radius:12px;background:rgba(8,10,15,.5)}
  .formAside{display:flex;flex-direction:column;gap:10px}
  .sideCard{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0d1017}
  .sideKicker{font-size:9.8px;letter-spacing:.36px;text-transform:uppercase;color:var(--mute);font-weight:800;margin-bottom:8px}
  .sideText{font-size:11.5px;color:var(--text);line-height:1.55}
  .focusList{display:flex;flex-wrap:wrap;gap:6px}
  .focusChip{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:rgba(91,157,255,.1);border:1px solid rgba(91,157,255,.18);font-size:10.5px;color:#cfe0ff}
  .walletForm .focusChip{background:rgba(124,91,255,.11);border-color:rgba(124,91,255,.2);color:#e0d4ff}
  .walletLead{grid-template-columns:1fr}
  .walletControls{margin-top:10px}
  .chk-row{display:flex;flex-wrap:wrap;gap:6px}
  .chk{display:inline-flex;align-items:center;gap:6px;background:#0d1017;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;cursor:pointer;user-select:none;transition:.12s}
  .chk:hover{border-color:var(--accent)}
  .chk input{accent-color:var(--accent);margin:0}
  .form-foot{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);flex-wrap:wrap}
  .run{background:linear-gradient(180deg,#3b7be8,#2c60c4);border:none;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:12px;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.1) inset;color:#fff}
  .run:disabled{opacity:.45;cursor:not-allowed}
  .runhint{font-size:10.5px;color:var(--mute)}
  .cu-badge{margin-left:auto;font-size:10px;color:var(--warn);font-weight:700;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);padding:2px 8px;border-radius:999px}
  .cmdline{background:#080a0f;border:1px solid var(--line);border-radius:7px;padding:6px 9px;margin-bottom:8px;font-family:ui-monospace,monospace;font-size:11px;color:#cdd3df;word-break:break-all;display:flex;align-items:center;gap:8px}
  .cmdline .copybtn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;color:var(--mute);font-size:10px;padding:2px 7px;cursor:pointer;flex-shrink:0}
  .cmdline .copybtn:hover{color:var(--accent);border-color:var(--accent)}
  .meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;font-size:11px;color:var(--mute)}
  .meta .chip{background:var(--panel);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
  .cu-chip{color:var(--warn);font-weight:600}
  .cache-chip{color:var(--good);font-weight:600}
  pre.out_body{background:#080a0f;border:1px solid var(--line);border-radius:9px;padding:11px;overflow:visible;margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;max-height:none}
  .rendered-box{background:#080a0f;border:1px solid var(--line);border-radius:9px;padding:11px;overflow:visible;max-height:none}
  .err{color:var(--bad)}
  .fmt-tabs{display:flex;gap:4px;margin-bottom:8px}
  .fmt-tab{background:var(--panel);border:1px solid var(--line);border-radius:7px 7px 0 0;padding:6px 16px;font-size:12px;font-weight:600;cursor:pointer;color:var(--mute);border-bottom:none;transition:.12s}
  .fmt-tab:hover{color:var(--text)}
  .fmt-tab.active{background:#080a0f;color:var(--accent);border-color:var(--accent)}
  .fmt-tab .cu-note{font-size:9.5px;color:var(--good);margin-left:4px;font-weight:500}
  .copy-addr:hover{color:var(--accent)!important}
  .addr-ext{margin-left:3px;color:var(--accent);text-decoration:none;font-size:11px;opacity:.75;cursor:pointer}
  .addr-ext:hover{opacity:1}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:#1a1f2b;border:1px solid var(--accent);color:var(--text);padding:8px 16px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ── Recent runs (collapsible) ── */
  aside.hist{border-left:1px solid var(--line);background:#0d1017;overflow:hidden;height:100%;transition:.18s;display:flex;flex-direction:column;min-width:0}
  .layout.no-hist aside.hist{display:none}
  .hh{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:6px;padding:8px 10px;background:#0d1017;border-bottom:1px solid var(--line);user-select:none}
  .hh .t{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mute)}
  .hh .hcnt{font-size:9.5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--mute)}
  .hh .hh-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
  .hh .hchev{color:var(--mute);font-size:12px;transition:.18s;cursor:pointer;padding:2px 4px;border-radius:6px}
  .hh .hchev:hover{color:var(--text);background:var(--panel2)}
  .hh button{background:none;border:none;color:var(--mute);cursor:pointer;font-size:12px;padding:2px 5px;border-radius:5px}
  .hh button:hover{color:var(--bad);background:var(--panel2)}
  .hbody{padding:8px;overflow:auto;min-height:0}
  .hitem{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:pointer;transition:.12s}
  .hitem:hover{border-color:var(--accent);background:var(--panel2)}
  .hitem .hk{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hitem .hd{font-size:9.5px;color:var(--mute);margin-top:2px;font-family:ui-monospace,monospace;display:flex;gap:6px;flex-wrap:wrap}
  .hitem .hd .hcu{color:var(--warn);font-weight:700}
  .hitem .hd .hbad{color:var(--bad);font-weight:700}
  .hempty{padding:10px 4px;font-size:11px;color:var(--mute)}
  /* ── Workflow drawer ── */
  .fd-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:110}
  .fd-scrim.show{opacity:1;pointer-events:auto}
  .flow-drawer{position:fixed;top:0;right:0;height:100vh;width:min(34vw,560px);min-width:320px;background:var(--panel);border-left:1px solid var(--line);box-shadow:-18px 0 44px rgba(0,0,0,.55);transform:translateX(100%);transition:transform .22s ease;z-index:120;display:flex;flex-direction:column}
  .flow-drawer.open{transform:translateX(0)}
  .fd-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0f1320,#0b0d12)}
  .fd-head .t{font-weight:700;font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fd-head button{background:none;border:none;color:var(--mute);font-size:16px;cursor:pointer;line-height:1}
  .fd-head button:hover{color:var(--text)}
  .fd-body{padding:14px;overflow:auto;font-size:12.5px;line-height:1.55}
  .fd-sec{margin-bottom:18px}
  .fd-sec h4{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:700}
  .flowStep{display:flex;gap:9px;padding:6px 0;align-items:flex-start}
  .flowStep .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .flowStep .txt{flex:1}
  .promptBox{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#0d1017;cursor:pointer;font-size:12px;line-height:1.55}
  .promptBox:hover{border-color:var(--accent)}
  /* ── Group filter bar (inside nav) ── */
  .grpbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:-8px -8px 6px;padding:8px;background:#0d1017;border-bottom:1px solid var(--line)}
  .grpbar .lbl{font-size:9.5px;color:var(--mute);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .grp{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:600;color:var(--mute);cursor:pointer;transition:.12s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .grp:hover{color:var(--text);border-color:var(--accent)}
  .grp.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grp .cnt{font-size:9px;opacity:.75;background:rgba(255,255,255,.15);padding:0 5px;border-radius:999px}
  @media (max-width:1450px){.layout{grid-template-columns:216px minmax(0,1fr) 276px}.layout.no-hist{grid-template-columns:216px minmax(0,1fr) 0}.sc{padding:6px 7px}.sc .body{padding-right:30px}.sc .nm{font-size:11px}.sc .ds{font-size:9.7px}}
  @media (max-width:1280px){.fld.wide{grid-column:1/-1}.skillSplit{grid-template-columns:1fr}.formAside{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}}
  @media (max-width:1100px){.layout{grid-template-columns:230px 1fr}.layout:not(.no-hist) aside.hist{grid-column:1/-1;border-left:none;border-top:1px solid var(--line);max-height:230px}}
  @media (max-width:820px){
    body{height:auto;overflow:auto}
    .layout{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 58px)}
    nav{border-right:none;border-bottom:1px solid var(--line);max-height:340px;overflow:auto}
    section.out{height:auto}
    aside.hist{height:auto;max-height:230px}
    .skillHero{grid-template-columns:1fr}
    .heroStats{grid-template-columns:1fr 1fr}
    .keybar{margin-left:0;width:100%}
    .keypanel{min-width:0;width:100%}
    .keyinput{flex:1;min-width:0}
    .keyinput input{width:100%;max-width:none}
    .headRight{margin-left:0;width:100%;justify-content:flex-end}
  }
</style>
</head>
<body>
<header>
  <h1>🧪 Birdeye Skills<span class="sub">Console</span></h1>
  <div class="keybar">
    <div class="keypanel">
      <div class="keytop">
        <span class="keystate" id="keyState">checking key…</span>
        <span class="keyhint" id="keyHint">Bring your own Birdeye API key. Stored in this browser only.</span>
      </div>
      <div class="keyfields" id="keyFields">
        <div class="keyinput">
          <input type="password" id="apiKey" placeholder="Paste your Birdeye API key here" autocomplete="off" spellcheck="false" autocapitalize="off">
          <button class="eyebtn" id="eyeBtn" title="Show / hide key" aria-label="Show or hide API key">👁</button>
        </div>

let _toastTimer;
function toast(msg){
  let t = $("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(_toastTimer); _toastTimer = setTimeout(()=>t.classList.remove("show"), 1600);
}
function copyText(t){
  if(!t) return;
  const done = ()=>toast("✓ Copied");
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, ()=>toast("Copy failed")); }
  else { const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); done(); }catch{ toast("Copy failed"); } a.remove(); }
}

/* ── API key bar ─────────────────────────────────────────────────────── */
function keyPresent(){ return !!state.userKey; }
function maskKey(k){ return k ? k.slice(0,2)+"****"+k.slice(-2) : ""; }

function renderKeyBar(){
  const fields = $("keyFields"), pill = $("keyState"), hint = $("keyHint");
  $("apiKey").value = state.userKey;
  const hasMeta = !!state.meta;
  if(state.userKey){
    pill.className = "keystate ok";
    pill.textContent = "✓ Using your key · " + maskKey(state.userKey);
    hint.textContent = "Stored in this browser only. You can replace it anytime.";
    fields.style.display = "flex";
  } else {
    pill.className = "keystate warn";
    pill.textContent = "⚠ Paste your Birdeye API key to run";
    hint.textContent = hasMeta && state.meta.env_key_present
      ? "This UI uses BYOK. Paste your own key below instead of the server key."
      : "Required on this UI. Press Enter or click 'Use this key' after pasting.";
    fields.style.display = "flex";
  }
  updateRunState();
}
function updateRunState(){
  const btn = $("runBtn");
  if(btn) btn.disabled = !keyPresent();
}
function toggleKeyFields(){
  try{ $("apiKey").focus(); $("apiKey").select(); }catch(e){}
}
async function loadMeta(){
  let m = null;
  // Vercel / generic serverless backend
  try{
    const r = await fetch("/api/meta", {cache:"no-store"});
    const j = await r.json();
    if(r.ok && typeof j.serverless !== "undefined") m = j;
  }catch(e){}
  // Fallback: local hub backend (birdeye_ui.py) — exposes /api/key-info, no /api/meta
  if(!m){
    try{
      const r = await fetch("/api/key-info", {cache:"no-store"});
      const j = await r.json();
      m = {serverless:false, env_key_allowed:true, env_key_present:!!j.key_set,
           env_key_mask:j.mask||"", key_required:!j.key_set, timeout_s:180, cli_ready:true};
    }catch(e){
      m = {serverless:false, env_key_allowed:true, env_key_present:false,
           key_required:true, timeout_s:180, cli_ready:false};
    }
  }
  state.meta = m;
  $("modePill").textContent = m.serverless
    ? `deployed · BYOK · max ${m.timeout_s}s/run`
    : `local · BYOK · max ${m.timeout_s}s/run`;
  if(m.cli_ready === false) $("modePill").textContent += " · ⚠ CLI missing";
  renderKeyBar();
}
function initKeyBar(){
  try{ state.userKey = localStorage.getItem(LS_KEY) || ""; }catch(e){ state.userKey = ""; }
  $("eyeBtn").onclick = ()=>{
    const inp = $("apiKey");
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    $("eyeBtn").textContent = show ? "🙈" : "👁";
    $("eyeBtn").title = show ? "Hide key" : "Show key";
  };
  $("keyUseBtn").onclick = async ()=>{
    const v = $("apiKey").value.trim();
    if(!v){ toast("Paste a key first"); return; }
    state.userKey = v;
    try{ localStorage.setItem(LS_KEY, v); }catch(e){}
    // Best effort: also register the key server-side (works on the local hub;
    // 404 on serverless backends where the per-run key is used instead).
    try{ fetch("/api/set-key",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:v})}); }catch(e){}
    $("apiKey").type = "password"; $("eyeBtn").textContent = "👁";
    renderKeyBar(); toast("✓ Key ready for this app");
  };
  $("keyClearBtn").onclick = ()=>{
    state.userKey = "";
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    $("apiKey").value = "";
    renderKeyBar(); toast("Key cleared");
  };
  $("apiKey").addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); $("keyUseBtn").click(); } });
  $("apiKey").addEventListener("focus", ()=>{ try{ $("apiKey").select(); }catch(_){} });
}

function histAll(){

}
function histSave(a){
  try{ localStorage.setItem(LS_HIST, JSON.stringify(a.slice(0, 30))); }catch(e){}
}
function histPush(entry){
  const a = histAll(); a.unshift(entry); histSave(a); renderHistory();
}
function renderHistory(){
  const a = histAll();
  const n = a.length;
  $("histCnt").textContent = n;
  $("histToggleCnt").textContent = n;
  const el = $("historyList");
  if(!n){ el.innerHTML = '<div class="hempty">No runs yet. Run a skill — results are cached here for 0-CU replay.</div>'; return; }
  el.innerHTML = a.map((r,i)=>{
    const cu = r.cu ? `<span class="hcu">⚡${r.cu} CU</span>` : "";
    const bad = r.exit ? `<span class="hbad">exit ${r.exit}</span>` : "";
    return `<div class="hitem" data-i="${i}" title="Click to replay (0 CU)">`
      + `<div class="hk">${esc(r.icon||"")} ${esc(r.name||r.skillId||"run")}${r.beta?' <span class="betabadge">beta</span>':''}</div>`
      + `<div class="hd"><span>${fmtTime(r.ts)}</span>${cu}${bad}</div></div>`;

function replayRun(i){

  state.fmt = "ui"; setFmt("ui"); paintFormat("ui");

      }
      if(el.checked) argv.push("--"+i.k.replace(/_/g,"-"));

      return;

    argv.push("--"+i.k.replace(/_/g,"-"), v);
  });
  // Canonical UI formats = ui/json/telegram/plain.
  // Map them once here to the CLI-specific format names.
  argv.push("--format", cliFormatForSkill(s, s.fmt || "ui"));
  return argv;
}

/* ── run ─────────────────────────────────────────────────────────────── */
function normalizeRun(j){
  if(j && j.formats) return j;                       // serverless rich payload
  const stdout = (j.stdout || "").replace(/^#RUN_ID[^\n]*\n?/, "");
  const blob = String(j.stderr || "") + "\n" + String(j.stdout || "");
  const rid = blob.match(/#RUN_ID\s+(\S+)/);
  const cu = blob.match(/cu=(\d+)/);
  const formats = {ui:"", json:"", telegram:"", plain:stdout};
  const t = stdout.trim();
  if(t.startsWith("{")){
    try{
      const o = JSON.parse(t);
      formats.json = t;
      formats.ui = (o && typeof o.html === "string") ? o.html
                  : `<pre class="out_body">${esc(JSON.stringify(o,null,2))}</pre>`;
    }catch(e){ formats.ui = `<pre class="out_body">${esc(t)}</pre>`; }
  } else if(t.startsWith("<")){
    formats.ui = t;
  } else {
    formats.ui = `<pre class="out_body">${esc(t)}</pre>`;
  }
  return {exit:j.exit, runId: rid?rid[1]:"", cu: cu?parseInt(cu[1],10):null,
          duration_ms:j.duration_ms, formats, text:stdout, stderr:j.stderr};
}

function htmlFromBlob(blob){
  const t = String(blob || "").trim();
  if(!t) return "";
  if(t.startsWith("<")) return t;
  if(t.startsWith("{") || t.startsWith("[")){
    try{
      const obj = JSON.parse(t);
      if(obj && typeof obj === "object"){
        if(typeof obj.html === "string" && obj.html.trim()) return obj.html;
        if(typeof obj.rendered_html === "string" && obj.rendered_html.trim()) return obj.rendered_html;
        if(obj.payload && typeof obj.payload.html === "string" && obj.payload.html.trim()) return obj.payload.html;
      }
    }catch(e){}
  }
  return "";
}
function textFallback(j){
  const f = j.formats || {};
  const stderr = String(j.stderr || "").trim();
  const text = String(j.text || "").trim();
  const stdout = String(j.stdout || "").trim();
  if(stderr) return stderr;
  if(text) return text;
  if(stdout) return stdout;
  if(f.plain) return f.plain;
  if(f.json) return f.json;
  return "";
}
function hydrateResult(j){
  const f = Object.assign({ui:"", json:"", telegram:"", plain:""}, j.formats || {});
  if(!f.ui){
    f.ui = htmlFromBlob(j.html) || htmlFromBlob(j.text) || htmlFromBlob(j.stdout) || htmlFromBlob(f.json) || htmlFromBlob(f.plain);
  }
  if(!f.json){
    const cand = [j.text, j.stdout, f.plain].map(v=>String(v || "").trim()).find(v=>v.startsWith("{") || v.startsWith("["));
    if(cand) f.json = cand;
  }
  if(!j.text) j.text = textFallback(j);
  j.formats = f;
  return j;
}

async function runSkill(){
  const btn = $("runBtn");
  if(!keyPresent()){ toast("Add your Birdeye API key first"); toggleKeyFields(); return; }
  const argv = buildArgv();
  btn.disabled = true;
  $("metaArea").innerHTML = "";
  $("fmtTabs").style.display = "none";
  $("cmdLineArea").style.display = "block";
  $("cmdLineArea").innerHTML = `<div class="cmdline"><button class="copybtn" id="copyCmdBtn">📋 copy</button><span>${esc(cmdString(argv))}</span></div>`;
  const cb = $("copyCmdBtn"); if(cb) cb.onclick = ()=>copyText(cmdString(argv));
  $("outputArea").innerHTML = '<div class="rendered-box">Running…</div>';
  const s = state.skill;
  try{
    const res = await fetch("/api/run", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({script:"birdeye_cli", argv, key: state.userKey}),
    });
    const raw = await res.json();
    if(!res.ok){
      if(raw.error === "api_key_required"){ $("outputArea").innerHTML = '<div class="rendered-box err">API key required — paste your Birdeye key (🔑 Key).</div>'; renderKeyBar(); }
      else $("outputArea").innerHTML = `<pre class="out_body err">${esc(raw.error||JSON.stringify(raw))}</pre>`;
      return;
    }
    const j = hydrateResult(normalizeRun(raw));
    showResult(j);
    histPush({id:j.runId||("local-"+Date.now()), ts:Date.now(), skillId:s.id, name:s.name,
              icon:s.icon, beta:!!s.beta, cu:j.cu, exit:j.exit, argv, formats:j.formats});
  }catch(e){
    $("outputArea").innerHTML = `<pre class="out_body err">${esc(String(e))}</pre>`;
  }finally{
    btn.disabled = !keyPresent();
  }
}

function showResult(j){
  state.last = hydrateResult(j);
  const meta = [];
  meta.push(`<span class="chip">exit ${state.last.exit}</span>`);
  if(state.last.duration_ms) meta.push(`<span class="chip">${(state.last.duration_ms/1000).toFixed(1)}s</span>`);
  if(state.last.cu) meta.push(`<span class="chip cu-chip">${state.last.cu} CU</span>`);
  if(state.last.runId) meta.push(`<span class="chip">${esc(String(state.last.runId).slice(-10))}</span>`);
  if(state.last.key_source) meta.push(`<span class="chip">key: ${esc(state.last.key_source)}</span>`);
  if(state.last.format_used) meta.push(`<span class="chip">fmt: ${esc(canonFormatName(state.last.format_used))}</span>`);
  if(state.last.exit === 124) meta.push('<span class="chip" style="color:var(--bad)">timeout — try a lighter skill</span>');
  if(state.last.exit && state.last.stderr) meta.push('<span class="chip" style="color:var(--bad)">see error output below</span>');
  $("metaArea").innerHTML = meta.join("");

  const f = state.last.formats || {};
  $("fmtTabs").querySelector('[data-fmt="telegram"]').style.display = f.telegram ? "" : "none";
  $("fmtTabs").querySelector('[data-fmt="json"]').style.display = f.json ? "" : "none";
  $("fmtTabs").querySelector('[data-fmt="plain"]').style.display = f.plain ? "" : "none";
  $("fmtTabs").style.display = "flex";
  setFmt("ui");
  paintFormat("ui");
}

function setFmt(fmt){
  state.fmt = fmt;
  document.querySelectorAll(".fmt-tab").forEach(t=>t.classList.toggle("active", t.dataset.fmt===fmt));
}
function paintFormat(fmt){
  const area = $("outputArea");
  const j = state.last;
  if(!j){ area.innerHTML = ""; return; }
  const f = j.formats || {};
  if(fmt === "ui"){
    if(f.ui){
      area.innerHTML = `<div class="rendered-box">${f.ui}</div>`;
    } else {
      const fallback = textFallback(j) || "No UI output for this skill.";
      area.innerHTML = `<pre class="out_body ${j.exit ? 'err' : ''}">${esc(fallback)}</pre>`;
    }
  } else if(fmt === "plain"){
    area.innerHTML = `<pre class="out_body">${esc(f.plain || textFallback(j) || "No plain output.")}</pre>`;
  } else if(fmt === "json"){
    let out = f.json || "";
    try{ out = JSON.stringify(JSON.parse(out), null, 2); }catch(e){}
    area.innerHTML = `<pre class="out_body">${esc(out || "No JSON output.")}</pre>`;
  } else if(fmt === "telegram"){
    area.innerHTML = `<pre class="out_body">${esc(f.telegram || "Telegram format not available for this skill.")}</pre>`;
  }
  if(j.stderr) console.log("stderr:", j.stderr);
  decorateAddrs();
}
document.querySelectorAll(".fmt-tab").forEach(t=>t.onclick=()=>{ setFmt(t.dataset.fmt); paintFormat(t.dataset.fmt); });

/* ── keyboard shortcuts: 1=All 2=Discover 3=Token 4=Wallet ───────────── */
const GROUP_KEYS = {"1":"all","2":"list","3":"token","4":"wallet"};
document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select"||tag==="textarea") return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(GROUP_KEYS[e.key]){ state.group = GROUP_KEYS[e.key]; renderSkillList(); }
});

/* ── boot ────────────────────────────────────────────────────────────── */
initKeyBar();
initHistory();
renderSkillList();
renderForm();
loadMeta();
</script>
